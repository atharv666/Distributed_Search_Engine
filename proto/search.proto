syntax = "proto3";
package distributedsearch;
service SearchService { rpc Search(SearchRequest) returns (SearchResponse); }
message SearchRequest { string query = 1; int32 top_k = 2; }
message SearchResult { int32 document_id = 1; double score = 2; string title = 3; string url = 4; string snippet = 5; string node_id = 6; }
message SearchResponse { repeated SearchResult results = 1; string node_id = 2; string statistics_version = 3; }
